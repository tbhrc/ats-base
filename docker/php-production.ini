; Production error handling: log everything server-side, never leak file
; paths/deprecation noise to the browser. This codebase (upstream, not our
; fork) still triggers PHP 8.1+ deprecation warnings in several places
; (dynamic property creation, etc.) that are cosmetic-only once
; display_errors is off, but are fatal when left on because they emit
; output before session/redirect headers are sent -- see the
; lib/Session.php strlen((string)...) fix in the same commit for the one
; case that was actually breaking login.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
