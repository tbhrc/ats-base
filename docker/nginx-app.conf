server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 20m;

    # OpenCATS's own PHP router handles path dispatch for these entry points;
    # everything else is a static asset served directly.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Never serve raw config, install lock marker, or dotfiles -- must come
    # before the general \.php$ handler below, since nginx uses the first
    # matching regex location among equals, not the most specific.
    location ~ ^/(config\.php|INSTALL_BLOCK)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # cloudflared terminates TLS and forwards plain HTTP to this
        # container, so $_SERVER['HTTPS'] is unset in PHP by default even
        # though every real request arrived over HTTPS. Without this,
        # OpenCATS's redirect-URL builder (e.g. after login) emits
        # http:// links, and the browser drops the `secure`-flagged
        # session_cookie on that plain-HTTP hop -- login POSTs 302, but
        # the session is gone by the time /index.php?m=home loads, so the
        # user lands back on the login form with no error. Every request
        # this nginx receives is already HTTPS end-to-end (Cloudflare ->
        # tunnel -> loopback), so it's correct to assert it unconditionally.
        fastcgi_param HTTPS on;
        include fastcgi_params;
    }
}
